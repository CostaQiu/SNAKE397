<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="google" content="notranslate">
<title>Snake</title>
<style>
  :root { --ink: #3a2750; }  /* same numbers and layout as the green page, drawn in the cartoon's dark purple ink */
  html, body { margin: 0; height: 100%; background: #bfe9ff; overflow: hidden; cursor: none; }
  canvas { display: block; position: fixed; left: 0; top: 0; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .txt { position: fixed; color: var(--ink); font-family: "Courier New", Consolas, monospace; line-height: 1.35; white-space: nowrap; }
  .txt .time { font-size: 2.6em; font-weight: bold; letter-spacing: .04em; text-align: center; }
  .txt .date { font-size: .8em; text-align: center; opacity: .8; }
  .txt .row { display: flex; justify-content: space-between; gap: 1.2em; }
  .txt .row span { opacity: .8; }
  .txt.inline { display: flex; gap: 1.8em; justify-content: center; }
  .txt.inline .row { display: inline-flex; gap: .5em; }
  .txt.clockline { display: flex; align-items: baseline; gap: .9em; justify-content: center; }
  .txt.clockline .time { font-size: 1.9em; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="c"></canvas>
<div id="clock" class="txt"><div class="time" id="time">--:--:--</div><div class="date" id="date"></div></div>
<div id="stats" class="txt">
  <div class="row"><span>SCORE</span><b id="score">0</b></div>
  <div class="row"><span>STEPS</span><b id="steps">0</b></div>
  <div class="row"><span>GAME TIME</span><b id="gtime">00:00:00</b></div>
</div>
<script src="replays_wins.js"></script>
<script>
(function () {
"use strict";
/* Cartoon Snake screensaver, plain 2D canvas (no WebGL, no libraries, works offline). Built to be light on the GPU:
   the background is painted once, the snake layer is only repainted when something changes, and the canvas runs at CSS-pixel resolution.
   The picture is a pure function of a shared clock (t0 in the URL), so several screens stay in lockstep. */
const W = 20, H = 20, DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const hash = location.hash;
const Q = (k, d) => { const m = hash.match(new RegExp("[#&]" + k + "=([0-9]+)")); return m ? +m[1] : d; };
const SLOT = Q("slot", 0), URL_SEED = Q("seed", 0), URL_STEP = Q("step", 0), URL_T0 = Q("t0", 0), SPS = Q("sps", 16);
const HOST_SCR = /host=scr/.test(hash);
const SOUND_ON = !HOST_SCR || /snd=1/.test(hash);       // with the .scr only one screen makes sound
const TAG = HOST_SCR ? "SnakeScr" : "SnakeCrt";          // the launcher reads "<TAG> slot= seed= step=" from the window title
const INK = "#3a2750";                                   // outlines and numbers
const BODY_COLORS = ["#5eead4", "#38bdf8", "#a78bfa"];  // exactly three body colours, in blocks of STRIPE cells counted from the head
const STRIPE = 15;       // block length: 15 cells of one colour, then the next colour, repeating after the 3rd
const HEAD_COLOR = "#34d058", APPLE_RED = "#ff4d5a", APPLE_STEM = "#8a5a32", APPLE_LEAF = "#4cd964";
const SAVE_KEY = "snakeCartoon.v1.slot" + SLOT;
const REPLAYS = window.REPLAYS_WINS || window.REPLAYS;
const $ = id => document.getElementById(id);
if (!REPLAYS || !REPLAYS.length) { document.body.textContent = "replays_wins.js not found"; return; }

/* ------------------------------------------------------------ game state (replayed from recorded moves) */
let G = null, TL = null, dirty = true, blinkOn = true, draws = 0;
function startGame(gi) {
  const r = REPLAYS[gi];
  G = { r, body: r.start.map(c => c.slice()), step: 0, foodIdx: 0, food: r.foods[0], score: 0, finished: false };
  dirty = true;
}
function simStep(quiet) {
  if (G.step >= G.r.moves.length) return false;
  const d = +G.r.moves[G.step], h = G.body[0], nh = [h[0] + DX[d], h[1] + DY[d]];
  const eating = G.food && nh[0] === G.food[0] && nh[1] === G.food[1];
  G.body.unshift(nh);
  if (!eating) G.body.pop();
  G.step++;
  if (eating) { G.score++; G.foodIdx++; G.food = G.r.foods[G.foodIdx] || null; if (!quiet) sfxEat(G.score); }
  if (G.step >= G.r.moves.length) { G.finished = true; if (!quiet) sfxWin(); }
  dirty = true;
  return true;
}
function tick(nowMs) {
  for (let n = 0; n < 3; n++) {
    const moves = G.r.moves.length;
    const target = TL.base + Math.max(0, (nowMs - TL.t0) / 1000) * SPS;
    if (target >= moves) {
      const finishMs = TL.t0 + (moves - TL.base) / SPS * 1000;
      if (nowMs - finishMs > 8000) {  // 8 s of blinking, then the next perfect game (same on every screen)
        TL = { gi: (TL.gi + 1) % REPLAYS.length, base: 0, t0: finishMs + 8000 };
        startGame(TL.gi);
        continue;
      }
      while (!G.finished) { if (!simStep(G.step < moves - 3)) break; }
      const on = Math.floor((nowMs - finishMs) / 500) % 2 === 0;  // blink the snake at 1 Hz after the last apple
      if (on !== blinkOn) { blinkOn = on; dirty = true; }
      return;
    }
    blinkOn = true;
    const targetStep = Math.floor(target);
    while (G.step < targetStep && !G.finished) { if (!simStep(G.step < targetStep - 3)) break; }  // quiet while catching up
    return;
  }
}

/* ------------------------------------------------------------ drawing */
const cv = $("c"), ctx = cv.getContext("2d"), bgcv = $("bg"), bg = bgcv.getContext("2d");
let cell = 10, ox = 0, oy = 0;
function layout() {
  // screensaver: CSS-pixel resolution on purpose (fewer pixels for the GPU to push on high-DPI screens);
  // as a normal page (phone, browser tab) use the screen's real sharpness, capped at 2x
  const w = innerWidth, h = innerHeight, dpr = HOST_SCR ? 1 : Math.min(window.devicePixelRatio || 1, 2);
  for (const c of [cv, bgcv]) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); c.style.width = w + "px"; c.style.height = h + "px"; c.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0); }
  cell = Math.max(6, Math.floor(Math.min(w, h) * 0.92 / W));
  ox = Math.floor((w - W * cell) / 2); oy = Math.floor((h - H * cell) / 2);
  drawBackground();
  layoutInfo();
  dirty = true;
}
function headingFromStart() {  // direction of the opening snake, before the first move
  const a = G.r.start[0], b = G.r.start[1];
  return DX.findIndex((v, k) => v === a[0] - b[0] && DY[k] === a[1] - b[1]);
}
function cloud(x, y, s) {  // soft white cloud, painted once
  bg.fillStyle = "rgba(255,255,255,.92)";
  for (const [dx, dy, r] of [[0, 0, 1], [1.1, -0.3, 1.25], [2.3, 0, 1], [1.1, 0.35, 1.1]]) { bg.beginPath(); bg.arc(x + dx * s, y + dy * s, r * s, 0, 6.2832); bg.fill(); }
}
function drawBackground() {  // sky, clouds, wooden frame, checkered lawn: painted once per layout
  const w = innerWidth, h = innerHeight, bw = W * cell, pad = Math.round(cell * 0.45);
  bg.fillStyle = "#bfe9ff"; bg.fillRect(0, 0, w, h);
  cloud(w * 0.07, h * 0.12, cell * 0.55); cloud(w * 0.80, h * 0.88, cell * 0.5); cloud(w * 0.86, h * 0.1, cell * 0.4);
  bg.lineJoin = "round";
  bg.fillStyle = "#ffc766"; bg.strokeStyle = "#a96d3b"; bg.lineWidth = Math.max(3, cell * 0.16);
  bg.beginPath(); if (bg.roundRect) bg.roundRect(ox - pad, oy - pad, bw + 2 * pad, bw + 2 * pad, cell * 0.5); else bg.rect(ox - pad, oy - pad, bw + 2 * pad, bw + 2 * pad);  // old browsers lack roundRect
  bg.fill(); bg.stroke();
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    bg.fillStyle = (x + y) % 2 ? "#b9ef86" : "#cbf79c"; bg.fillRect(ox + x * cell, oy + y * cell, cell, cell);
  }
}
function drawApple(c) {  // cartoon apple with an outline: round body, dent at the top, stem, leaf, highlight
  const u = cell, cx = ox + c[0] * u + u / 2, cy = oy + c[1] * u + u * 0.58;
  const disc = (x, y, r, color) => { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(cx + x * u, cy + y * u, r * u, 0, 6.2832); ctx.fill(); };
  disc(0, 0.02, 0.37, INK);
  ctx.fillStyle = INK; ctx.fillRect(cx - 0.065 * u, cy - 0.44 * u, 0.13 * u, 0.2 * u);
  ctx.fillStyle = APPLE_STEM; ctx.fillRect(cx - 0.035 * u, cy - 0.42 * u, 0.07 * u, 0.18 * u);
  ctx.fillStyle = INK; ctx.beginPath(); ctx.ellipse(cx + 0.15 * u, cy - 0.37 * u, 0.15 * u, 0.085 * u, -0.45, 0, 6.2832); ctx.fill();
  ctx.fillStyle = APPLE_LEAF; ctx.beginPath(); ctx.ellipse(cx + 0.15 * u, cy - 0.37 * u, 0.12 * u, 0.06 * u, -0.45, 0, 6.2832); ctx.fill();
  disc(0, 0.02, 0.32, APPLE_RED);
  disc(0, -0.29, 0.06, INK);                          // the dent
  disc(-0.13, -0.08, 0.06, "rgba(255,255,255,.85)");  // highlight
}
function drawHead(p, dir) {  // round green head with outline, eyes that look the way the snake goes, blush
  const u = cell, ux = DX[dir], uy = DY[dir], px = -uy, py = ux;  // forward and sideways unit vectors
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(p[0], p[1], 0.52 * u, 0, 6.2832); ctx.fill();
  ctx.fillStyle = HEAD_COLOR; ctx.beginPath(); ctx.arc(p[0], p[1], 0.46 * u, 0, 6.2832); ctx.fill();
  for (const s of [-1, 1]) {
    const ex = p[0] + (ux * 0.1 + px * s * 0.21) * u, ey = p[1] + (uy * 0.1 + py * s * 0.21) * u;
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(ex, ey, 0.22 * u, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex, ey, 0.185 * u, 0, 6.2832); ctx.fill();
    ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(ex + ux * 0.07 * u, ey + uy * 0.07 * u, 0.1 * u, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "rgba(255,120,160,.75)"; ctx.beginPath(); ctx.arc(p[0] + (-ux * 0.12 + px * s * 0.33) * u, p[1] + (-uy * 0.12 + py * s * 0.33) * u, 0.07 * u, 0, 6.2832); ctx.fill();
  }
}
function draw() {
  draws++;
  ctx.clearRect(ox - cell, oy - cell, W * cell + 2 * cell, H * cell + 2 * cell);  // only the board area is repainted
  if (blinkOn) {
    const n = G.body.length, u = cell, pts = G.body.map(c => [ox + (c[0] + 0.5) * u, oy + (c[1] + 0.5) * u]);
    // taper over the last 8 cells so the tail ends in a point; width of segment i (between cell i and i+1)
    const wid = i => u * 0.74 * Math.min(1, 0.45 + 0.55 * (n - 2 - i) / 8);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (let i = n - 2; i >= 0; i--) {  // outline pass, tail to head
      ctx.strokeStyle = INK; ctx.lineWidth = wid(i) + u * 0.14;
      ctx.beginPath(); ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(pts[i + 1][0], pts[i + 1][1]); ctx.stroke();
    }
    for (let i = n - 2; i >= 0; i--) {  // colour pass: block k of STRIPE cells from the head gets colour k mod 3
      ctx.strokeStyle = BODY_COLORS[Math.floor(i / STRIPE) % BODY_COLORS.length]; ctx.lineWidth = wid(i);
      ctx.beginPath(); ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(pts[i + 1][0], pts[i + 1][1]); ctx.stroke();
    }
    drawHead(pts[0], G.step > 0 ? +G.r.moves[G.step - 1] : headingFromStart());
  }
  if (G.food) drawApple(G.food);
}

/* ------------------------------------------------------------ numbers in the empty space around the board */
const pad2 = n => String(n).padStart(2, "0");
const fmtHMS = sec => { sec = Math.max(0, Math.floor(sec)); return pad2(Math.floor(sec / 3600)) + ":" + pad2(Math.floor(sec % 3600 / 60)) + ":" + pad2(sec % 60); };
function updateInfo() {
  if (!G) return;
  const d = new Date();
  $("time").textContent = d.toLocaleTimeString("en-GB");
  $("date").textContent = d.toLocaleDateString("en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  $("score").textContent = G.score;
  $("steps").textContent = G.step.toLocaleString();
  $("gtime").textContent = fmtHMS(G.step / SPS);
}
function layoutInfo() {
  const w = innerWidth, h = innerHeight, land = w >= h, free = (Math.max(w, h) - 0.92 * Math.min(w, h)) / 2;
  const clock = $("clock"), stats = $("stats"), show = free >= 60;
  clock.style.display = stats.style.display = show ? "" : "none";
  if (!show) return;
  // measure with the longest text that can ever appear, so nothing overflows later and widths never jump
  const worst = { time: "88:88:88", date: "Wednesday, December 28, 2026", score: "397", steps: "31,593", gtime: "01:05:49" };
  for (const id in worst) $(id).textContent = worst[id];
  const reset = el => { el.style.left = el.style.right = el.style.top = el.style.bottom = "auto"; el.style.transform = "none"; el.style.maxWidth = "none"; };
  reset(clock); reset(stats);
  const overflow = () => stats.scrollWidth > stats.clientWidth + 1 || clock.scrollWidth > clock.clientWidth + 1;
  if (land) {  // empty columns left and right of the board
    const cw = free * 0.84, gap = free * 0.08;
    let fs = free * 0.075;
    clock.className = "txt"; stats.className = "txt";
    for (let i = 0; i < 14; i++) {
      for (const el of [clock, stats]) { el.style.width = cw + "px"; el.style.fontSize = fs + "px"; el.style.top = "50%"; el.style.transform = "translateY(-50%)"; }
      if (!overflow()) break;
      fs *= 0.93;
    }
    clock.style.left = gap + "px"; stats.style.right = gap + "px";
  } else {     // empty strips above and below the board: single-line versions
    let fs = Math.min(free * 0.3, w * 0.04);
    clock.className = "txt clockline"; stats.className = "txt inline";
    for (let i = 0; i < 20; i++) {
      for (const el of [clock, stats]) { el.style.width = "auto"; el.style.maxWidth = w * 0.96 + "px"; el.style.fontSize = fs + "px"; el.style.left = "50%"; el.style.transform = "translateX(-50%)"; }
      if (Math.max(clock.offsetHeight, stats.offsetHeight) <= free * 0.9 && !overflow()) break;
      fs *= 0.93;
    }
    for (const el of [clock, stats]) el.style.width = el.offsetWidth + "px";  // freeze the width: digits changing must not move anything
    clock.style.top = Math.max(2, (free - clock.offsetHeight) / 2) + "px";
    stats.style.bottom = Math.max(2, (free - stats.offsetHeight) / 2) + "px";
  }
  updateInfo();  // replace the measuring text with the real values
}

/* ------------------------------------------------------------ sound: soft cartoon blips (one screen only) */
let ac = null, master = null;
function initAudio() {
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
  } catch (e) { ac = null; }
}
function beep(freq, t, dur, vol) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "triangle"; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function sfxEat() { if (!ac) return; const t = ac.currentTime; beep(660, t, 0.1, 0.3); beep(990, t + 0.09, 0.14, 0.3); }
function sfxWin() { if (!ac) return; const t = ac.currentTime; [523.25, 659.25, 783.99, 1046.5, 1318.5, 1568].forEach((f, i) => beep(f, t + i * 0.12, 0.22, 0.3)); }
function sfxStart() { if (!ac) return; const t = ac.currentTime; [523.25, 659.25, 783.99].forEach((f, i) => beep(f, t + i * 0.13, 0.18, 0.3)); }

/* ------------------------------------------------------------ progress (browser fallback) and main loop */
function saveProgress() { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ seed: G.r.seed, step: G.step })); } catch (e) { /* no storage */ } }
function loadProgress() { try { return JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch (e) { return null; } }

const saved = URL_SEED ? { seed: URL_SEED, step: URL_STEP } : loadProgress();
let gi = 0, base = 0;  // every screen plays the same game
if (saved) { const f = REPLAYS.findIndex(r => r.seed === saved.seed); if (f >= 0) { gi = f; base = saved.step; } }
TL = { gi, base, t0: URL_T0 || Date.now() };
startGame(gi);
if (SOUND_ON) {
  initAudio(); sfxStart();
  for (const ev of ["pointerdown", "keydown"]) window.addEventListener(ev, () => { if (ac && ac.state === "suspended") ac.resume(); }, { once: true });
}
if (!HOST_SCR) {  // opened as a normal page (phone, browser tab): silent until the first tap, a tap toggles sound, the screen is kept awake
  const hint = document.createElement("div");
  hint.style.cssText = "position:fixed;left:50%;bottom:12px;transform:translateX(-50%);padding:6px 14px;border-radius:14px;background:rgba(58,39,80,.85);color:#fff;font:14px 'Courier New',monospace;transition:opacity .6s;z-index:9;pointer-events:none;white-space:nowrap";
  document.body.appendChild(hint);
  let soundNow = false, hideT = 0;
  const say = s => { hint.textContent = s; hint.style.opacity = 1; clearTimeout(hideT); hideT = setTimeout(() => { hint.style.opacity = 0; }, 2500); };
  if (master) master.gain.value = 0;  // browsers block sound before a gesture anyway
  say("Tap for sound");
  window.addEventListener("pointerdown", () => {
    if (ac && ac.state === "suspended") ac.resume();
    soundNow = !soundNow; if (master) master.gain.value = soundNow ? 0.9 : 0;
    say(soundNow ? "Sound on (tap to mute)" : "Sound off (tap for sound)");
  });
  const keepAwake = async () => { try { await navigator.wakeLock.request("screen"); } catch (e) { /* not supported or not allowed */ } };
  keepAwake();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
}
window.addEventListener("resize", layout);
window.addEventListener("pagehide", saveProgress);
layout();

let lastTick = 0, lastInfo = 0, lastTitle = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  // check the clock on every display refresh so steps land on time (an even rhythm); drawing only happens when something changed
  const nowMs = Date.now();
  tick(nowMs);
  if (ts - lastInfo > 250) { lastInfo = ts; updateInfo(); }
  if (ts - lastTitle > 1000) {
    lastTitle = ts; saveProgress();
    document.title = TAG + " slot=" + SLOT + " seed=" + G.r.seed + " step=" + G.step + " audio=" + (ac ? ac.state : "off");  // read by the launcher
  }
  if (dirty) { dirty = false; draw(); updateInfo(); }  // numbers always match the picture, even right after a catch-up
}
requestAnimationFrame(loop);
window.__cartoon = { get geom() { return { cell, ox, oy }; }, get G() { return G; }, get draws() { return draws; }, get TL() { return TL; }, simStep, startGame };
})();
</script>
</body>
</html>
