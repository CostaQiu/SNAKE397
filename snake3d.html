<!doctype html>
<html lang="zh" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>卡通 3D 贪吃蛇</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3a2750;
    --card: #fff8e8;
    --accent: #ff7a59;
    --accent2: #35c9a8;
    --shadow: 0 4px 0 rgba(58, 39, 80, .9);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe9ff; color: var(--ink);
    font-family: "Fredoka", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  .card { background: var(--card); border: 3px solid var(--ink); border-radius: 18px; box-shadow: var(--shadow); }
  #hud { position: fixed; top: 14px; left: 14px; display: flex; gap: 10px; flex-wrap: wrap; max-width: calc(100% - 28px); }
  .stat { padding: 6px 14px; min-width: 92px; text-align: center; }
  .stat b { display: block; font-size: 28px; line-height: 1.1; }
  .stat span { font-size: 12px; opacity: .7; }
  #score b { color: var(--accent); }

  #title { position: fixed; top: 14px; right: 14px; padding: 8px 14px; text-align: right; }
  #title h1 { margin: 0; font-size: 18px; }
  #title p { margin: 2px 0 0; font-size: 12px; opacity: .7; }

  #games { position: fixed; top: 84px; right: 14px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  #games button { min-width: 108px; }

  #bar { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); width: max-content; display: flex; gap: 8px; padding: 8px 10px;
    align-items: center; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 20px); }
  button { font: inherit; font-weight: 700; color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 14px;
    padding: 6px 12px; cursor: pointer; box-shadow: 0 3px 0 rgba(58,39,80,.9); transition: transform .08s, box-shadow .08s, background .15s; }
  button:hover { background: #ffe9a8; }
  button:active { transform: translateY(3px); box-shadow: 0 0 0 rgba(0,0,0,0); }
  button.on { background: var(--accent2); color: #fff; }
  button.sel { background: var(--accent); color: #fff; }
  .sep { width: 3px; height: 26px; background: var(--ink); opacity: .25; border-radius: 2px; }

  #live { position: fixed; top: 84px; left: 14px; padding: 8px 14px; display: none; font-size: 13px; line-height: 1.55; max-width: 290px; }
  #live b { font-size: 15px; color: var(--accent); }
  #live .ok { color: #1a9a7a; font-weight: 700; }
  body.saver #hud, body.saver #title, body.saver #games, body.saver #bar, body.saver #hint, body.saver #live, body.saver #end, body.saver #overlay { display: none !important; }
  body.saver, body.saver * { cursor: none !important; }
  #sv { display: none; }
  body.saver #sv { display: block; }
  body.saver.noinfo #sv { display: none; }
  .sv-card { position: fixed; background: rgba(255, 248, 232, .84); border: 3px solid var(--ink); border-radius: 22px; box-shadow: var(--shadow);
    color: var(--ink); text-align: center; line-height: 1.3; }
  .sv-time { font-weight: 700; font-size: 2.5em; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .sv-date { opacity: .75; font-size: .85em; }
  .sv-row { display: flex; justify-content: space-between; gap: .8em; }
  .sv-row span { opacity: .75; }
  .sv-row b { font-variant-numeric: tabular-nums; }
  .sv-card.col .sv-row { padding: .12em 0; }
  .sv-card.col .sv-game { justify-content: center; font-weight: 700; margin-bottom: .2em; }
  .sv-card.row { display: flex; gap: 1.6em; justify-content: center; white-space: nowrap; }
  .sv-card.row .sv-row { display: inline-flex; gap: .4em; }
  .sv-card.clockrow { align-items: baseline; gap: .8em; }
  .sv-card.clockrow .sv-time { font-size: 1.8em; }
  #hint { position: fixed; bottom: 86px; left: 50%; transform: translateX(-50%); font-size: 12px; opacity: .65; pointer-events: none; text-align: center; }

  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(191,233,255,.55);
    backdrop-filter: blur(4px); z-index: 10; }
  #overlay .panel { padding: 28px 36px; text-align: center; max-width: 420px; }
  #overlay h2 { margin: 0 0 6px; font-size: 32px; }
  #overlay p { margin: 6px 0 16px; opacity: .8; line-height: 1.5; }
  #overlay button { font-size: 20px; padding: 10px 26px; background: var(--accent); color: #fff; }

  #end { position: fixed; top: 96px; left: 50%; transform: translate(-50%, -16px) scale(.7); padding: 14px 26px; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .35s, transform .35s cubic-bezier(.3, 1.6, .5, 1); z-index: 5; max-width: calc(100% - 28px); }
  #end.show { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
  #end h2 { margin: 0; font-size: 30px; }
  #end p { margin: 6px 0 12px; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 20; background: #fff8e8; padding: 24px; text-align: center; }
  @media (max-width: 900px) {
    #live { top: 134px; max-width: calc(100% - 28px); }
    #games { top: 84px; left: 14px; right: 14px; flex-direction: row; overflow-x: auto; align-items: stretch; padding-bottom: 6px; }
    #games button { flex: 0 0 auto; min-width: 0; white-space: nowrap; padding: 4px 10px; font-size: 13px; }
  }
  @media (max-width: 640px) {
    .stat { min-width: 70px; padding: 4px 8px; } .stat b { font-size: 22px; }
    #title { display: none; } #hint { display: none; }
    #bar button { padding: 4px 9px; font-size: 13px; }
    #bar { gap: 6px; padding: 6px 8px; }
  }
</style>
</head>
<body>
<div id="stage"></div>

<div id="hud">
  <div class="card stat" id="score"><b id="v-score">0</b><span>🍎 分数</span></div>
  <div class="card stat"><b id="v-len">3</b><span>📏 长度</span></div>
  <div class="card stat"><b id="v-step">0</b><span>👣 步数</span></div>
</div>
<div id="title" class="card"><h1>🐍 卡通 3D 贪吃蛇</h1><p>网络 + 食物导向搜索 · 对局回放</p></div>
<div id="games"></div>
<div id="live" class="card"><b>⚡ 实时运算</b><div id="live-text"></div></div>

<div id="end" class="card"><h2 id="end-title"></h2><p id="end-text"></p><button id="end-next">▶ 下一局</button></div>

<div id="sv">
  <div class="sv-card" id="sv-clock"><div class="sv-time" id="sv-time">--:--:--</div><div class="sv-date" id="sv-date"></div></div>
  <div class="sv-card" id="sv-stats">
    <div class="sv-row sv-game"><span id="sv-game"></span></div>
    <div class="sv-row"><span>🍎 分数</span><b id="sv-score">0</b></div>
    <div class="sv-row"><span>👣 步数</span><b id="sv-steps">0</b></div>
    <div class="sv-row"><span>⏱ 本局用时</span><b id="sv-gtime">00:00:00</b></div>
    <div class="sv-row"><span>🕒 本次已运行</span><b id="sv-run">00:00:00</b></div>
  </div>
</div>
<div id="hint">拖动旋转视角 · 滚轮缩放</div>
<div id="bar" class="card">
  <button id="b-play" title="暂停 / 继续">⏸ 暂停</button>
  <div class="sep"></div>
  <span id="speeds"></span>
  <div class="sep"></div>
  <button id="b-ff" title="直接跳到本局结束">⏭ 跳到结尾</button>
  <button id="b-replay" title="从头再看一遍">🔁 重播</button>
  <button id="b-live" title="AI 在 Python 里实时运算，边算边播（需要先运行 live_server.py）" disabled>⚡ 实时运算</button>
  <div class="sep"></div>
  <button id="b-sfx" class="on" title="音效">🔊 音效</button>
  <button id="b-bgm" class="on" title="背景音乐">🎵 音乐</button>
  <button id="b-cam" title="恢复默认视角">📷 视角</button>
</div>

<div id="overlay"><div class="card panel">
  <h2>🐍 卡通 3D 贪吃蛇</h2>
  <p>看 AI 玩一局贪吃蛇！<br>它是强化学习网络，加上"以食物为目标"的搜索。<br>最长的一局要走约 2.8 万步，可以随时加速。</p>
  <button id="b-start">▶ 点击开始</button>
</div></div>
<div id="err"><div class="card panel" style="padding:24px"><h2>😢 无法显示 3D 画面</h2><p id="err-msg"></p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="replays.js"></script>
<script>if (/saver/.test(location.hash)) document.write('<script src="replays_wins.js"><\/script>');</script>
<script>
(function () {
"use strict";
const $ = id => document.getElementById(id);
const W = 20, H = 20;
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const SPEEDS = [[8, "1×"], [20, "2×"], [60, "5×"], [200, "20×"], [800, "80×"]];
let speedIdx = 1, paused = false;

function fail(msg) { $("err").style.display = "flex"; $("err-msg").textContent = msg; }
if (!window.THREE) { fail("three.js 没有加载成功，请检查网络。"); return; }
const SAVER = /saver/.test(location.hash);  // screensaver mode: no UI, loops perfect games forever
const SLOT = +((location.hash.match(/slot=(\d+)/) || [])[1] || 0);      // which screen this window is on
const SAVER_SPS = +((location.hash.match(/sps=(\d+)/) || [])[1] || 8);  // constant speed in steps/second (8 = the viewer's "1x")
const SAVE_KEY = "snakeSaver.v1.slot" + SLOT;
const URL_T0 = +((location.hash.match(/t0=(\d+)/) || [])[1] || 0);  // shared start time (epoch ms): every screen derives the same frame from it
const SOUND_ON = !/host=scr/.test(location.hash) || /snd=1/.test(location.hash);  // with the .scr only one screen makes sound
let TL = null;  // screensaver timeline {gi: game index, base: step at t0, t0: epoch ms}
// screensaver power knobs (hash params, so they can be compared): the picture barely changes, no need to draw like a game
const Q = (k, d) => { const m = location.hash.match(new RegExp("[#&]" + k + "=([0-9]+)")); return m ? +m[1] : d; };
const ECO_FPS = SAVER ? Q("fps", 20) : 0;         // draw at most this many frames/s (0 = every display frame)
const ECO_PR = SAVER ? Q("pr", 1) : 0;            // pixel ratio: 1 = CSS pixels, 0 = full device resolution
const ECO_LP = SAVER ? Q("lp", 1) : 0;            // 1 = ask the browser for the low-power GPU
const ECO_SHADOW = SAVER ? Q("sh", 1024) : 2048;  // shadow map size
const ECO_AA = SAVER ? Q("aa", 1) : 1;
const SHOW_INFO = SAVER ? Q("info", 1) : 0;       // 1 = show the score / clock cards            // 1 = antialiasing
const TITLE_TAG = /host=scr/.test(location.hash) ? "SnakeScr" : "Snake3D";  // only the .scr launcher passes host=scr
// the launcher (SnakeSaver.scr) passes the last progress in the URL, because Edge kiosk is InPrivate and cannot store it
const URL_SEED = +((location.hash.match(/seed=(\d+)/) || [])[1] || 0);
const URL_STEP = +((location.hash.match(/step=(\d+)/) || [])[1] || 0);
const REPLAYS = SAVER && window.REPLAYS_WINS ? window.REPLAYS_WINS : window.REPLAYS;
if (!REPLAYS || !REPLAYS.length) { fail("找不到 replays.js，请先运行 python record_games.py"); return; }

/* ------------------------------------------------------------ audio */
let ac = null, master, sfxBus, musicBus, sfxOn = true, bgmOn = true;
function initAudio() {
  if (ac) { if (ac.state === "suspended") ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  ac = new AC();
  master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
  sfxBus = ac.createGain(); sfxBus.connect(master);
  musicBus = ac.createGain(); musicBus.gain.value = 0.55; musicBus.connect(master);
  const delay = ac.createDelay(); delay.delayTime.value = 0.28;
  const fb = ac.createGain(); fb.gain.value = 0.3;
  delay.connect(fb); fb.connect(delay); delay.connect(master);
  musicBus.connect(delay);
  if (!SAVER) startMusic();  // three screens playing music at once would be a mess
}
function tone(freq, t, dur, o = {}) {
  if (!ac) return;
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = o.type || "sine";
  osc.frequency.setValueAtTime(freq, t);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
  if (o.vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = 6; lg.gain.value = o.vib; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + dur + 0.05); }
  const vol = o.vol || 0.25, a = o.attack || 0.006;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(o.bus || sfxBus);
  osc.start(t); osc.stop(t + dur + 0.05);
}
function pop(t, vol) {
  if (!ac) return;
  const n = Math.floor(ac.sampleRate * 0.05), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = buf; f.type = "bandpass"; f.frequency.value = 1800; g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(sfxBus); src.start(t);
}
const PENTA = [0, 2, 4, 7, 9];
const sfx = {
  eat(score) {
    if (!ac || !sfxOn) return;
    const t = ac.currentTime, k = score % 5, oct = Math.floor(score / 5) % 2;
    const f = 523.25 * Math.pow(2, PENTA[k] / 12 + oct);
    tone(f, t, 0.14, { type: "triangle", vol: 0.3 });
    tone(f * 1.5, t + 0.07, 0.18, { type: "triangle", vol: 0.24 });
    tone(f * 2, t + 0.07, 0.12, { type: "sine", vol: 0.08 });
    pop(t, 0.25);
  },
  win() {
    if (!ac || !sfxOn) return;
    const t = ac.currentTime, n = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1568, 2093];
    n.forEach((f, i) => tone(f, t + i * 0.1, 0.35, { type: "triangle", vol: 0.28 }));
    [523.25, 659.25, 783.99, 1046.5].forEach(f => tone(f, t + 0.8, 1.4, { type: "square", vol: 0.08, attack: 0.02 }));
    for (let i = 0; i < 6; i++) pop(t + 0.8 + i * 0.12, 0.2);
  },
  lose() {
    if (!ac || !sfxOn) return;
    const t = ac.currentTime;
    [[311, 0], [294, 0.42], [277, 0.84]].forEach(([f, d]) => tone(f, t + d, 0.38, { type: "sawtooth", vol: 0.16, vib: 6 }));
    tone(262, t + 1.26, 1.0, { type: "sawtooth", vol: 0.18, to: 170, vib: 10 });
  },
  start() {  // short chime when the screensaver starts, so you know the sound works
    if (!ac || !sfxOn) return;
    const t = ac.currentTime;
    [523.25, 659.25, 783.99].forEach((f, i) => tone(f, t + i * 0.13, 0.35, { type: "triangle", vol: 0.28 }));
  },
  click() { if (ac && sfxOn) tone(880, ac.currentTime, 0.07, { type: "sine", vol: 0.15, to: 1320 }); },
  spawn() { if (ac && sfxOn) tone(1200, ac.currentTime, 0.06, { type: "sine", vol: 0.06, to: 1800 }); },
};
let musicTimer = null, nextNote = 0, noteStep = 0;
const MEL = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33, 659.25, 783.99];
const BASS = [130.81, 98.0, 110.0, 87.31];
let melIdx = 4;
function startMusic() {
  if (musicTimer) return;
  nextNote = ac.currentTime + 0.1;
  musicTimer = setInterval(() => {
    if (!ac) return;
    while (nextNote < ac.currentTime + 0.25) {
      if (bgmOn) {
        const chord = Math.floor(noteStep / 8) % 4;
        if (noteStep % 4 === 0) tone(BASS[chord], nextNote, 0.5, { type: "triangle", vol: 0.16, bus: musicBus });
        if (Math.random() < 0.72) {
          melIdx = Math.max(0, Math.min(MEL.length - 1, melIdx + Math.floor(Math.random() * 5) - 2));
          tone(MEL[melIdx], nextNote, 0.26, { type: "sine", vol: 0.1, bus: musicBus });
        }
      }
      nextNote += 0.27; noteStep++;
    }
  }, 40);
}

/* ------------------------------------------------------------ three.js setup */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: !!ECO_AA, powerPreference: ECO_LP ? "low-power" : "default" });
} catch (e) { fail("这个浏览器不支持 WebGL。"); return; }
renderer.setPixelRatio(ECO_PR ? ECO_PR : Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$("stage").appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe9ff);
scene.fog = new THREE.Fog(0xbfe9ff, 45, 90);
const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 200);

scene.add(new THREE.HemisphereLight(0xffffff, 0xb7d9ff, 0.5));
const sun = new THREE.DirectionalLight(0xfff3d6, 0.55);
sun.position.set(9, 20, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(ECO_SHADOW, ECO_SHADOW);
Object.assign(sun.shadow.camera, { left: -17, right: 17, top: 17, bottom: -17, near: 1, far: 60 });
sun.shadow.bias = -0.0006;
scene.add(sun);

// three-step toon ramp gives the flat cartoon shading bands
const ramp = new THREE.DataTexture(new Uint8Array([120, 190, 255]), 3, 1, THREE.LuminanceFormat);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
const toon = (color) => new THREE.MeshToonMaterial({ color, gradientMap: ramp });
const INK = 0x3a2750;
const inkMat = new THREE.MeshBasicMaterial({ color: INK, side: THREE.BackSide });

const sphereGeo = new THREE.SphereGeometry(1, 24, 16);
function addOutline(mesh, k = 1.12) {
  const o = new THREE.Mesh(mesh.geometry, inkMat);
  o.scale.setScalar(k); mesh.add(o); return o;
}
const wx = x => x - (W - 1) / 2, wz = y => y - (H - 1) / 2;

/* ground: checkerboard tiles on a dirt block with a fence */
(function buildBoard() {
  const base = new THREE.Mesh(new THREE.BoxGeometry(W + 2.4, 1.2, H + 2.4), toon(0x9b6a46));
  base.position.y = -0.7; base.receiveShadow = true; scene.add(base);
  const tiles = new THREE.InstancedMesh(new THREE.BoxGeometry(0.995, 0.2, 0.995), toon(0xffffff), W * H);
  const m = new THREE.Matrix4(), c = new THREE.Color();
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    m.makeTranslation(wx(x), -0.1, wz(y)); tiles.setMatrixAt(y * W + x, m);
    tiles.setColorAt(y * W + x, c.set((x + y) % 2 ? 0xa9ec8f : 0xbff5a6));
  }
  tiles.receiveShadow = true; scene.add(tiles);
  const fenceMat = toon(0xffc66b);
  const half = W / 2 + 0.35;
  [[0.7, H + 1.4, half, 0], [0.7, H + 1.4, -half, 0], [W + 1.4, 0.7, 0, half], [W + 1.4, 0.7, 0, -half]].forEach(([sx, sz, px, pz]) => {
    const f = new THREE.Mesh(new THREE.BoxGeometry(sx, 0.7, sz), fenceMat);
    f.position.set(px, 0.2, pz); f.castShadow = f.receiveShadow = true; scene.add(f);
  });
  // fence posts
  const postGeo = new THREE.CylinderGeometry(0.28, 0.32, 1.1, 10), postMat = toon(0xf59b3b);
  for (let i = 0; i <= 10; i++) {
    const t = -W / 2 + (i / 10) * W;
    [[t, -half], [t, half], [-half, t], [half, t]].forEach(([px, pz]) => {
      const p = new THREE.Mesh(postGeo, postMat); p.position.set(px, 0.35, pz); p.castShadow = true; scene.add(p);
    });
  }
})();

/* decoration: round trees, bushes and drifting clouds */
const clouds = [];
(function decorate() {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2 + rnd() * 0.3, r = 17 + rnd() * 5;
    const g = new THREE.Group(), s = 0.8 + rnd() * 0.7;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.38, 1.6, 8), toon(0x9b6a46)); trunk.position.y = 0.6; g.add(trunk);
    const leaf = new THREE.Mesh(sphereGeo, toon(i % 3 === 0 ? 0xff9eb5 : (i % 3 === 1 ? 0x62d36b : 0x7be08a)));
    leaf.scale.setScalar(1.35); leaf.position.y = 2.1; leaf.castShadow = true; g.add(leaf); addOutline(leaf, 1.07);
    g.position.set(Math.cos(a) * r, 0, Math.sin(a) * r); g.scale.setScalar(s); scene.add(g);
  }
  for (let i = 0; i < 5; i++) {
    const g = new THREE.Group();

    const a = prev[Math.min(i, prev.length - 1)], b = body[i];
    const x = wx(lerp(a[0], b[0], alpha)), z = wz(lerp(a[1], b[1], alpha));
    let s = 0.47 * lerp(0.5, 1, Math.max(0, Math.min(1, (L - 1 - i) / 9)));
    for (const born of bulges) { const p = stepF - born, d = i - p; if (p < L + 3) s *= 1 + 0.32 * Math.exp(-(d * d) / 3.2); }
    if (i === growIdx) s *= easeBack(growT);
    const y = 0.45 + wave * Math.sin(t * 7 - i * 0.7) * wob + (!SAVER && G.finished && G.r.result === "win" ? Math.abs(Math.sin(t * 5 - i * 0.35)) * 0.35 : 0);
    setInst(i * 2, x, y, z, s);
    // connector between this segment and the previous one (towards the head)
    const pa = i === 1 ? null : lastPos;
    if (i === 1) { lastPos = [wx(lerp(prev[0][0], body[0][0], alpha)), 0.5, wz(lerp(prev[0][1], body[0][1], alpha))]; }
    setInst(i * 2 + 1, (x + lastPos[0]) / 2, (y + lastPos[1]) / 2, (z + lastPos[2]) / 2, s * 0.95);
    lastPos = [x, y, z];
    drawn = i * 2 + 2;
  }
  bodyMesh.count = bodyInk.count = Math.max(drawn, 2);
  bodyMesh.instanceMatrix.needsUpdate = bodyInk.instanceMatrix.needsUpdate = true;
  if (bodyMesh.instanceColor) bodyMesh.instanceColor.needsUpdate = true;

  // head
  const h0 = prev[0], h1 = body[0];
  const hx = wx(lerp(h0[0], h1[0], alpha)), hz = wz(lerp(h0[1], h1[1], alpha));
  const target = -G.dir * Math.PI / 2;
  let diff = ((target - headAng + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
  headAng += diff * Math.min(1, dt * 16);
  const popS = 1 + 0.3 * Math.exp(-(stepF - (bulges.length ? bulges[bulges.length - 1] : -9)) * 1.6);
  const hy = 0.52 + (SAVER ? 0 : (G.finished && G.r.result === "win" ? Math.abs(Math.sin(t * 6)) * 0.5 : 0.04 * Math.sin(t * 7)));
  head.position.set(hx, hy, hz);
  head.rotation.y = headAng + (!SAVER && G.finished && G.r.result !== "win" ? Math.sin(t * 3) * 0.35 : 0);
  head.scale.setScalar(popS);

  // eyes follow the apple; blink now and then; dizzy when stuck
  let lx = 0;
  if (G.food) {
    const fxw = wx(G.food[0]) - hx, fzw = wz(G.food[1]) - hz, c = Math.cos(headAng), sn = Math.sin(headAng);
    const lxx = fxw * c - fzw * sn, lzz = fxw * sn + fzw * c, n = Math.hypot(lxx, lzz) || 1;
    lx = lxx / n;
    void lzz;
  }
  const blink = (t % 3.4) > 3.28 ? 0.12 : 1;
  const stuck = G.finished && G.r.result !== "win";
  eyes.forEach(e => {
    e.white.scale.y = 0.27 * blink;
    if (stuck) e.pupil.position.set(Math.cos(t * 9 + e.s) * 0.4, 0.45 + Math.sin(t * 9 + e.s) * 0.25, -0.62);
    else e.pupil.position.set(lx * 0.35, 0.45, -0.62);
  });
  const fl = Math.max(0, Math.sin(t * 5)); const tl = 0.15 + 0.85 * Math.pow(fl, 3);
  tongue.scale.z = tl; tongue.position.set(0, -0.08, -0.7 - 0.16 * tl);
  dizzy.visible = stuck; if (stuck) { dizzy.position.set(hx, 1.9 + Math.sin(t * 4) * 0.1, hz); dizzy.material.rotation = Math.sin(t * 3) * 0.3; }

  // apple
  if (G.food) {
    appleT = Math.min(1, appleT + dt * 3);
    const s = easeBack(appleT);
    apple.visible = appleShadow.visible = true;
    apple.position.set(wx(G.food[0]), 0.06 * Math.sin(t * 3) , wz(G.food[1]));
    apple.rotation.y = t * 1.2; apple.scale.setScalar(Math.max(0.001, s));
    appleShadow.position.x = apple.position.x; appleShadow.position.z = apple.position.z;
    appleShadow.scale.setScalar(Math.max(0.001, s) * (1 - 0.08 * Math.sin(t * 3)));
  } else { apple.visible = appleShadow.visible = false; }

  // confetti + popups + clouds
  parts.forEach(p => {
    if (!p.m.visible) return;
    p.life -= dt; if (p.life <= 0) { p.m.visible = false; return; }
    p.v.y -= 9 * dt; p.m.position.addScaledVector(p.v, dt);
    p.m.rotation.x += p.spin.x * dt; p.m.rotation.y += p.spin.y * dt; p.m.scale.setScalar(Math.min(1, p.life * 2));
    if (p.m.position.y < 0.1) { p.m.position.y = 0.1; p.v.y *= -0.4; }
  });
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i]; p.t += dt; const k = p.t / p.life;
    p.s.position.y = p.y0 + k * 1.3; p.s.material.opacity = 1 - k * k; p.s.scale.setScalar(1 + 0.3 * Math.sin(Math.min(1, k * 3) * Math.PI));
    p.s.scale.set(2.2 * (1 + 0.3 * Math.sin(Math.min(1, k * 3) * Math.PI)), 1.1 * (1 + 0.3 * Math.sin(Math.min(1, k * 3) * Math.PI)), 1);
    if (k >= 1) { scene.remove(p.s); p.s.material.map.dispose(); p.s.material.dispose(); popups.splice(i, 1); }
  }
  if (G.finished && G.r.result === "win" && Math.random() < 0.6) burst((Math.random() - 0.5) * 18, 9, (Math.random() - 0.5) * 18, 2, 0);
  clouds.forEach(c => { c.position.x += c.userData.v * dt; if (c.position.x > 48) c.position.x = -48; });

  if (G.r.live) liveTick();
  if (((t * 10) | 0) !== frame.hudTick) { frame.hudTick = (t * 10) | 0; updateHud(); }
  placeCamera(t);
  renderer.render(scene, camera);
}
let lastPos = [0, 0, 0];

/* ------------------------------------------------------------ UI wiring */
function updateHud() {
  if (!G) return;
  $("v-score").textContent = G.score; $("v-len").textContent = G.body.length; $("v-step").textContent = G.step.toLocaleString();
  if (G.r.live) $("live-text").innerHTML = liveText();
}
function syncPlayBtn() { $("b-play").textContent = G && G.finished ? "🔁 再看一遍" : (paused ? "▶ 继续" : "⏸ 暂停"); }
function buildSpeeds() {
  const box = $("speeds"); box.innerHTML = "";
  SPEEDS.forEach(([, label], i) => {
    const b = document.createElement("button"); b.textContent = label; b.className = i === speedIdx ? "sel" : "";
    b.style.marginRight = "4px"; b.onclick = () => { speedIdx = i; sfx.click(); buildSpeeds(); }; box.appendChild(b);
  });
}
function updateGameButtons() {
  const box = $("games"); box.innerHTML = "";
  REPLAYS.forEach((r, i) => {
    const b = document.createElement("button");
    b.textContent = `${["①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧", "⑨"][i] || i + 1} ${r.result === "win" ? "🏆" : ""}${r.score}`;
    b.className = i === gameIdx ? "sel" : ""; b.onclick = () => { sfx.click(); startGame(i); }; box.appendChild(b);
  });
  $("b-live").classList.toggle("sel", !!(G && G.r.live));
}
$("b-play").onclick = () => { sfx.click(); if (G.finished) beginGame(G.r); else paused = !paused; syncPlayBtn(); };
$("b-replay").onclick = () => { sfx.click(); beginGame(G.r); };
$("b-live").onclick = () => { sfx.click(); startLive(); };
let ffBusy = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));
$("b-ff").onclick = async () => {
  sfx.click(); if (G.finished || ffBusy) return;
  if (G.r.live) {  // ask the server to finish computing the whole game first
    ffBusy = true; $("b-ff").textContent = "⏳ 运算中…";
    const r = G.r;
    while (!r.done && !liveStat.error) { while (liveStat.inflight) await sleep(30); await fetchMore(4000); }
    $("b-ff").textContent = "⏭ 跳到结尾"; ffBusy = false;
    if (G.r !== r) return;  // the user started another game meanwhile
  }
  while (!G.finished) { if (!simStep(true)) break; }
  G.prev = G.body.map(c => c.slice()); bulges = []; growIdx = -1; updateHud();
  if (G.r.result === "win") sfx.win(); else sfx.lose();
};
$("b-sfx").onclick = e => { sfxOn = !sfxOn; e.target.classList.toggle("on", sfxOn); e.target.textContent = sfxOn ? "🔊 音效" : "🔇 音效"; sfx.click(); };
$("b-bgm").onclick = e => { bgmOn = !bgmOn; e.target.classList.toggle("on", bgmOn); e.target.textContent = bgmOn ? "🎵 音乐" : "🎵 静音"; sfx.click(); };
$("b-cam").onclick = () => { Object.assign(cam, camDefault); cam.touched = false; sfx.click(); };
$("end-next").onclick = () => { sfx.click(); if (G.r.live) startLive(); else startGame((gameIdx + 1) % REPLAYS.length); };
cv.addEventListener("pointerdown", () => { cam.touched = true; });
$("b-start").onclick = async () => {
  initAudio(); sfx.click(); $("overlay").style.display = "none";
  await liveReady;
  if (liveAvailable && location.hash === "#live") startLive(); else startGame(0);
};
window.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); $("b-play").click(); }
  if (e.key === "ArrowRight") { speedIdx = Math.min(SPEEDS.length - 1, speedIdx + 1); buildSpeeds(); }
  if (e.key === "ArrowLeft") { speedIdx = Math.max(0, speedIdx - 1); buildSpeeds(); }
});

buildSpeeds(); resize();
if (SAVER) {
  document.body.classList.add("saver");
  if (!SHOW_INFO) document.body.classList.add("noinfo");
  layoutInfo();  // lay out again now that the cards are visible (their height can only be measured when shown)
  cam.tz = 0; camDefault.tz = 0; document.title = "Snake3D";
  const saved = URL_SEED ? { seed: URL_SEED, step: URL_STEP } : loadProgress();
  let gi = 0, base = 0;  // every screen plays the same game
  if (saved) {
    const found = REPLAYS.findIndex(r => r.seed === saved.seed);
    if (found >= 0) { gi = found; base = saved.step; }
  }
  TL = { gi, base, t0: URL_T0 || Date.now() };
  startGame(gi, true);
  if (SOUND_ON) {
    initAudio(); sfx.start();
    for (const ev of ["pointerdown", "keydown"]) window.addEventListener(ev, () => { if (ac && ac.state === "suspended") ac.resume(); }, { once: true });
  }
  saveProgress();
  window.addEventListener("pagehide", saveProgress);
  window.addEventListener("beforeunload", saveProgress);
} else startGame(0, false); // show the board behind the start card
requestAnimationFrame(frame);
window.__snake3d = { cam, get G() { return G; }, startGame, startLive, get liveAvailable() { return liveAvailable; }, liveStat, simStep, sfx, get ac() { return ac; }, setSpeed(i) { speedIdx = i; buildSpeeds(); } };
})();
</script>
